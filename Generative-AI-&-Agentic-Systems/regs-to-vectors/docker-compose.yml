# PostgreSQL 16 with the pgvector extension, for local runs.
#   docker compose up -d
#   python -m regvec.pipeline --parts 56 57 75 77 --store pg:postgresql://postgres:postgres@localhost:5432/regs
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: regs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
