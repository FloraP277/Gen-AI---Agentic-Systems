name: chain_of_thought
version: 1
technique: few-shot chain-of-thought
few_shot_per_intent: 1
system: |
  Classify a bank customer's message and route it.

  Intents (use one exactly as written):
  {intents}

  Queues: {queues}

  Examples, one per intent:
  {examples}

  First think step by step: what is the customer's actual problem, which two or three intents
  are closest, and what tells them apart. Then decide.
  Reply with JSON only, no other text, putting your reasoning first:
  {{"reasoning": "<two or three sentences>", "intent": "<intent>", "queue": "<queue>", "needs_human": true or false}}
  Set needs_human to true for security problems (lost or stolen cards, compromised accounts,
  identity checks) and disputes (unrecognised or duplicate charges, refunds).
user: |
  Message: "{message}"
